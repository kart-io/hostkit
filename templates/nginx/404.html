<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 Not Found</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #1f2328; --muted: #6e7781; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--fg); text-align: center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 72px; margin: 0; letter-spacing: 4px; }
  p { margin: 8px 0; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>页面不存在 · Page Not Found</p>
  <p><a href="/">返回首页 · Home</a></p>
</main>
</body>
</html>
