<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404 - 页面不存在 · Page Not Found</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.96);
    --card-border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --brand-primary: #2563eb;
    --brand-hover: #1d4ed8;
    --brand-light: rgba(37, 99, 235, 0.1);
    --btn-secondary-bg: #f1f5f9;
    --btn-secondary-text: #334155;
    --btn-secondary-hover: #e2e8f0;
    --shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.92);
      --card-border: #1f2937;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --brand-primary: #3b82f6;
      --brand-hover: #60a5fa;
      --brand-light: rgba(59, 130, 246, 0.16);
      --btn-secondary-bg: #1f2937;
      --btn-secondary-text: #e2e8f0;
      --btn-secondary-hover: #374151;
      --shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 18%, var(--brand-light) 0%, transparent 60%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 48px 32px;
    text-align: center;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }

  .icon-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: var(--brand-light);
    color: var(--brand-primary);
    margin-bottom: 24px;
  }

  .code {
    font-size: 76px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 12px;
    color: var(--brand-primary);
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-muted);
    margin-bottom: 32px;
  }

  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background-color: var(--brand-primary);
    color: #ffffff;
  }
  .btn-primary:hover {
    background-color: var(--brand-hover);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background-color: var(--btn-secondary-bg);
    color: var(--btn-secondary-text);
  }
  .btn-secondary:hover {
    background-color: var(--btn-secondary-hover);
  }

  .footer {
    margin-top: 36px;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.7;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<main class="card">
  <div class="icon-box">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>
  <div class="code">404</div>
  <h1>页面不存在 · Page Not Found</h1>
  <p>您访问的页面不存在或已被移除，请检查输入的网址是否正确。</p>
  <div class="btn-group">
    <button class="btn btn-secondary" onclick="if(window.history.length>1){window.history.back();}else{window.location.href='/';}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      返回上一页
    </button>
    <a href="/" class="btn btn-primary">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      返回首页
    </a>
  </div>
  <div class="footer">HostKit Edge Gateway</div>
</main>
</body>
</html>
