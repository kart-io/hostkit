# 由 hostkit 生成，勿手改；业务 location 放到 locations/*.conf
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAMES__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    include /etc/nginx/locations/*.conf;
}
