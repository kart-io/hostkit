# 由 hostkit 生成，变量见同目录 .env
name: base-nginx

services:
  nginx:
    image: ${IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./locations:/etc/nginx/locations:ro
      - ./auth:/etc/nginx/auth:ro
      - ./html:/etc/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [base]

  # 仅供 `docker compose run --rm certbot ...` 使用
  certbot:
    image: ${CERTBOT_IMAGE}
    profiles: [tools]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/logs:/var/log/letsencrypt
    network_mode: bridge

networks:
  base:
    name: ${NETWORK_NAME}
    external: true
