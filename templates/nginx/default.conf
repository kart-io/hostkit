# 由 hostkit 生成，勿手改；业务 location 放到 locations/*.conf，各域名站点在 conf.d/site-*.conf
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# 代理缓冲区优化：避免大型静态资源落盘缓冲告警
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# WebSocket / 长连接升级映射：有 Upgrade 头时设为 upgrade，否则为 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Nginx 自己产生的 404 用自定义页面；反代到后端的 404 原样透传
error_page 404 /.hostkit/404.html;

# 没在 SITES 里的域名和直接用 IP 访问：HTTP 走主站
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 没匹配到任何 location 时返回 404；不能写 location /，会和 / 路由（如 demo）重复
    try_files "" =404;
    location = /.hostkit/404.html {
        internal;
        alias /etc/nginx/html/404.html;
    }

    include /etc/nginx/locations/*.conf;
}

# HTTPS 只服务有证书的站点，其余握手直接拒绝，不拿别的域名的证书应付
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
