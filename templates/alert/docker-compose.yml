# 由 hostkit 生成，变量见同目录 .env；规则见 rules/
name: base-alert

services:
  vmalert:
    image: ${IMAGE}
    restart: unless-stopped
    command:
      - -datasource.url=http://victoriametrics:8428/vm
      # 告警状态写回 VM，重启后 for 计时不丢
      - -remoteRead.url=http://victoriametrics:8428/vm
      - -remoteWrite.url=http://victoriametrics:8428/vm
      - -notifier.url=http://alertmanager:9093/am
      - -rule=/etc/vmalert/rules/*.yml
      - -http.pathPrefix=/vmalert
    volumes:
      - ./rules:/etc/vmalert/rules:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vmalert.rule=PathPrefix(`/vmalert`)"
      - "traefik.http.routers.vmalert.entrypoints=websecure"
      - "traefik.http.routers.vmalert.tls=true"
      - "traefik.http.routers.vmalert.middlewares=auth-obs@file"
      - "traefik.http.services.vmalert.loadbalancer.server.port=8880"
    networks: [base]

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.route-prefix=/am
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./am-data:/alertmanager
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=PathPrefix(`/am`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls=true"
      - "traefik.http.routers.alertmanager.middlewares=auth-obs@file"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
    networks: [base]

  alert-feishu:
    image: ${PYTHON_IMAGE}
    restart: unless-stopped
    user: "65534:65534"
    command: ["python", "-u", "/app/feishu.py"]
    environment:
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK}
      FEISHU_SECRET: ${FEISHU_SECRET}
      HOST_NAME: ${HOST_NAME}
    volumes:
      - ./feishu.py:/app/feishu.py:ro
    networks: [base]

networks:
  base:
    name: ${NETWORK_NAME}
    external: true
