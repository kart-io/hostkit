# 由 hostkit 生成，变量见同目录 .env；采集配置见 config.yaml
name: base-otel

services:
  otel-collector:
    image: ${IMAGE}
    restart: unless-stopped
    # 读宿主机 /proc、root 属主的容器日志与 docker.sock
    user: "0:0"
    environment:
      HOST_NAME: ${HOST_NAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /:/hostfs:ro
      - ${DOCKER_CONTAINERS_DIR}:/var/lib/docker/containers:ro
      # 只读挂载也能调用全部 Docker API，等同宿主机 root；collector 不对外暴露端口
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [base]

networks:
  base:
    name: ${NETWORK_NAME}
    external: true
