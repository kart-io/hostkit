http:
  middlewares:
    auth-obs:
      basicAuth:
        usersFile: "/etc/traefik/auth/htpasswd"

    strip-traefik-prefix:
      stripPrefix:
        prefixes:
          - "/traefik"

    security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        customFrameOptionsValue: "SAMEORIGIN"

    custom-404:
      plugin:
        custom404:
          filePath: "/etc/traefik/html/404.html"

  # 优先级（数值大者先匹配）：兜底 404 为 1，SITES 的 main 站点 2，demo 3，内置服务站点 4，
  # 组件路径路由（/vm /vl 等）用 Traefik 默认的规则长度，容器名:端口站点和根路径跳转 1000
  routers:
    catchall-404:
      entryPoints:
        - "websecure"
      rule: "PathPrefix(`/`)"
      priority: 1
      service: "noop@internal"
      middlewares:
        - "custom-404"
      tls: {}
