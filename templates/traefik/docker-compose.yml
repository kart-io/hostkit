# 由 hostkit 生成，变量见同目录 .env
name: base-traefik

services:
  traefik:
    image: ${IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./conf.d:/etc/traefik/conf.d:ro
      - ./acme:/etc/traefik/acme
      - ./auth:/etc/traefik/auth:ro
      - ./plugins-local:/plugins-local:ro
      - ./html:/etc/traefik/html:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    networks: [base]
    labels:
      - "traefik.enable=true"
      # Dashboard 控制台（通过 /traefik 访问，受 basicauth 保护）
      - "traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/traefik`) || PathPrefix(`/api`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-obs@file,strip-traefik-prefix@file"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"

networks:
  base:
    name: ${NETWORK_NAME}
    external: true
