# 由 hostkit 生成，变量见同目录 .env
name: base-redis

services:
  redis:
    image: ${IMAGE}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ./data:/data
    networks: [base]

networks:
  base:
    name: ${NETWORK_NAME}
    external: true
