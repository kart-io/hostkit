# 由 hostkit 生成，变量见同目录 .env
name: base-victorialogs

services:
  victorialogs:
    image: ${IMAGE}
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${RETENTION}
      - -http.pathPrefix=/vl
    volumes:
      - ./data:/victoria-logs-data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.victorialogs.rule=PathPrefix(`/vl`)"
      - "traefik.http.routers.victorialogs.entrypoints=websecure"
      - "traefik.http.routers.victorialogs.tls=true"
      - "traefik.http.routers.victorialogs.middlewares=auth-obs@file"
      - "traefik.http.services.victorialogs.loadbalancer.server.port=9428"
    networks: [base]

networks:
  base:
    name: ${NETWORK_NAME}
    external: true
