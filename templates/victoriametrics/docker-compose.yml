# 由 hostkit 生成，变量见同目录 .env
name: base-victoriametrics

services:
  victoriametrics:
    image: ${IMAGE}
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${RETENTION}
      - -http.pathPrefix=/vm
      # OTel 指标名转成 Prometheus 风格（system_memory_usage_bytes），PromQL/告警规则按此书写
      - -opentelemetry.usePrometheusNaming
    volumes:
      - ./data:/victoria-metrics-data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.victoriametrics.rule=PathPrefix(`/vm`)"
      - "traefik.http.routers.victoriametrics.entrypoints=websecure"
      - "traefik.http.routers.victoriametrics.tls=true"
      - "traefik.http.routers.victoriametrics.middlewares=auth-obs@file"
      - "traefik.http.services.victoriametrics.loadbalancer.server.port=8428"
    networks: [base]

networks:
  base:
    name: ${NETWORK_NAME}
    external: true
